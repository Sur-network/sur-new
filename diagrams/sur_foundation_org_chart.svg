<text x="380" y="410" text-anchor="middle" style="fill:rgb(120, 113, 108);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">پنج کمیته‌ی بنیاد بر پایه‌ی اساسنامه نیستند (تفویض ماده ۲۳/تبصره ۶)؛ بودجه‌ی هر کمیته را هیأت‌مدیره تعیین می‌کند.</text>
<text x="380" y="428" text-anchor="middle" style="fill:rgb(120, 113, 108);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">بنیاد کنترلی روی اجماع، ولیدیتورها یا خزانه‌ی ولیدیتورها ندارد؛ کمیته‌ی فنی Verifier و RewardRouter را فقط توسعه می‌دهد (اجرا با هیأت‌مدیره‌ی ولیدیتورها)</text>
<text x="380" y="452" text-anchor="middle" style="fill:rgb(60, 52, 137);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">موجودی اولیه‌ی بنیاد در genesis: ۲۰,۰۰۰,۰۰۰ سورن + ۱۵٪ از کل بلاک‌ریوارد (FoundationDAO)</text>
<text x="380" y="470" text-anchor="middle" style="fill:rgb(60, 52, 137);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">خرج خزانه‌ی بنیاد (سورن و ERC20): اکثریت عددی اعضای هیأت‌مدیره، بدون سقف؛ ورود/خروج عضو: مجمع فوق‌العاده</text>
