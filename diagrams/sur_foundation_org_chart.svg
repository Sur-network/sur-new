<text x="640" y="350" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central">کمیته‌ی تبلیغات</text>
<text x="640" y="368" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:central">و روابط‌عمومی</text>
</g>

<text x="380" y="410" text-anchor="middle" style="fill:rgb(120, 113, 108);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">کمیته‌ها بر پایه‌ی اساسنامه نیستند — با اختیار عام هیأت‌مدیره (ماده ۲۳) و آیین‌نامه‌ی داخلی ایجاد می‌شوند</text>
<text x="380" y="428" text-anchor="middle" style="fill:rgb(120, 113, 108);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">بنیاد هیچ کنترلی روی شبکه، ولیدیتورها یا اوراکل‌ها ندارد — فقط از خزانه‌ی ولیدیتورها بودجه درخواست می‌کند</text>
<text x="380" y="452" text-anchor="middle" style="fill:rgb(60, 52, 137);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">موجودی اولیه‌ی بنیاد در genesis: ۲۰,۰۰۰,۰۰۰ سورن (توزیع طبق ماده ۳-۶ اساسنامه)</text>
<text x="380" y="470" text-anchor="middle" style="fill:rgb(60, 52, 137);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">افزودن/حذف عضو و خرج این موجودی: نصاب دوسوم آرا؛ بقیه‌ی تصمیمات: اکثریت ساده</text>
