<text x="590" y="160" text-anchor="middle" dominant-baseline="central" style="fill:rgb(185, 28, 28);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">مستقل، دوره‌ی ۲ ساله؛ ناظر مالی</text>
</g>

