<svg width="100%" viewBox="0 0 720 420" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title style="fill:rgb(0,0,0);font-family:anthropic-sans, sans-serif;font-size:16px;">وثیقه‌ی لازم برای عضویت ولیدیتور بر حسب تعداد ولیدیتور فعال</title>
<desc style="fill:rgb(0,0,0);font-family:anthropic-sans, sans-serif;font-size:16px;">✅ به‌روزشده با پارامترهای نهایی: با فرض ۵۰۰,۰۰۰ سورن وثیقه‌ی پایه و رشد مرکب ۲برابرشونده هر ۴۰ ولیدیتور *پرداخت‌کننده* (۷ ولیدیتور مؤسس رایگان genesis-seeded شمرده نمی‌شوند)، وثیقه‌ی لازم برای عضویت ولیدیتور جدید از حدود ۵۲۷ هزار سورن در ۱۰ ولیدیتور کل تا حدود ۲.۵۱ میلیون سورن در ۱۰۰ ولیدیتور کل رشد می‌کند — نسبت به منحنی قبلی (پایه ۲ میلیون، دوبرابرشدن هر ۱۶ ولیدیتور فعال، که در N=۱۰۰ به ۱۵۲ میلیون می‌رسید)، مانع سرمایه‌ای ورود به‌طور چشمگیری کاهش یافته است. نقاط علامت‌گذاری‌شده هر ۱۰ ولیدیتور (مضرب ۱۰) هستند.</desc>

