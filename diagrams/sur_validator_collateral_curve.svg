<svg width="100%" viewBox="0 0 720 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0,0,0);font-family:anthropic-sans, sans-serif;font-size:16px;">وثیقه‌ی لازم برای عضویت ولیدیتور بر حسب تعداد ولیدیتور فعال</title>
<desc style="fill:rgb(0,0,0);font-family:anthropic-sans, sans-serif;font-size:16px;">با فرض ۲,۰۰۰,۰۰۰ سورن وثیقه‌ی پایه و رشد مرکب ۲برابرشونده هر ۱۶ ولیدیتور فعال، وثیقه‌ی لازم برای عضویت ولیدیتور جدید از حدود ۳.۱ میلیون سورن در ۱۰ ولیدیتور تا حدود ۱۵۲ میلیون سورن در ۱۰۰ ولیدیتور رشد می‌کند. نقاط علامت‌گذاری‌شده هر ۱۰ ولیدیتور (مضرب ۱۰) هستند.</desc>

