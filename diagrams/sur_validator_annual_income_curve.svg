<svg width="100%" viewBox="0 0 720 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0,0,0);font-family:anthropic-sans, sans-serif;font-size:16px;">درآمد سالانه‌ی هر ولیدیتور بر حسب تعداد ولیدیتور فعال</title>
<desc style="fill:rgb(0,0,0);font-family:anthropic-sans, sans-serif;font-size:16px;">با فرض بلاک‌ریوارد ۲ سورن، بلاک‌پریود ۳ ثانیه، و سهم ۵۰٪ ولیدیتورها از بلاک‌ریوارد (بدون احتساب فی تراکنش که غیرقابل‌پیش‌بینی است)، درآمد سالانه‌ی هر ولیدیتور از حدود ۱ میلیون سورن در ۱۰ ولیدیتور تا حدود ۱۰۵ هزار سورن در ۱۰۰ ولیدیتور کاهش می‌یابد — یک منحنی کاهشی هذلولی‌وار (۱/N)، نه نمایی. نقاط علامت‌گذاری‌شده هر ۱۰ ولیدیتور (مضرب ۱۰) هستند.</desc>

