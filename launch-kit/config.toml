# =====================================================================================================
# SUR (chain id 262) — پیکربندی نود ولیدیتور Besu 26.9.0 (QBFT، حالت validator-contract)        پیشنهاد کیت راه‌اندازی v2.5
# =====================================================================================================
# این فایل «پیشنهاد» است، نه تصمیم نهایی. هر گزینه یکی از این برچسب‌ها را دارد:
#   VERIFIED    = با همین مقدار روی hyperledger/besu:26.9.0 (Docker، لینوکس) بلند شد و رفتار گفته‌شده دیده شد
#                 (genesis آزمایشی GenesisBuilder، یک نود؛ 2026-11-20). «رفتار با چند ولیدیتور و روی شبکهٔ واقعی» جدا گفته می‌شود.
#   UNVERIFIED  = از سند گرفته شد یا آزموده نشد؛ پیش از راه‌اندازی باید آزموده شود
#   OWNER       = تصمیمی است که مالک/کمیته باید بگیرد (مقدار فعلی فقط پیش‌فرض آزموده‌شده است)
# منبع‌ها: [T] = آزمون‌های زندهٔ قبلی (testing-evidence/besu-live-test-*، soak-kit-v25)  [D] = سند طراحی  [K] = این کیت (آزمون تازه)
#
# مسیرها مسیر «داخل کانتینر» هستند؛ docker-compose.yml فایل‌ها را همین‌جا mount می‌کند:
#   /config/genesis.json (فقط‌خواندنی)   /config/static-nodes.json (فقط‌خواندنی)   /secrets/node.key (فقط‌خواندنی)   /data (volume)
# هیچ کلید یا رازی در این فایل نیست. کلید نود (= کلید اپراتور) فقط از مسیر /secrets/node.key خوانده می‌شود.
# =====================================================================================================

# ---------------------------------------------------------------------------- ذخیره و هویت
# مسیر داده. [T] VERIFIED
data-path="/data"

# genesis واقعی که با `build` ساخته و با `verify` بررسی شده و همراه sha256 پخش می‌شود. همهٔ نودها باید بایت‌به‌بایت یکسان باشند. [T] VERIFIED
genesis-file="/config/genesis.json"

# کلید خصوصی نود. در حالت validator-contract آدرس مشتق‌شده از این کلید باید «اپراتور» ثبت‌شده در ValidatorsRegistry باشد
# (نه کلید مالک: کلید مالک هرگز روی نود نمی‌آید). مسیر فایل از .env می‌آید؛ فایل در مخزن نیست. [T][D] VERIFIED
node-private-key-file="/secrets/node.key"

# فرمت ذخیرهٔ state. BONSAI پیش‌فرض و همان است که همهٔ آزمون‌های قبلی با آن رفتند [T]. VERIFIED (بلند شد، بانر: Data storage: Bonsai).
# هشدار طراحی [D]: در Bonsai بیرون از حدود 512 بلاک اخیر، eth_getBalance → null و trace_block → [] «بدون خطا» برمی‌گردد.
# نیاز تاریخی RewardRouter را نود RPC جداگانه (FOREST/archive) پوشش دهد، نه نود ولیدیتور. FOREST هم با QBFT بلند شد و بلاک تولید کرد
# (VERIFIED فقط راه‌اندازی [K])؛ رفتار طولانی‌مدت و حجم دیسک UNVERIFIED. فرمت بعد از ساخت پایگاه داده را نمی‌شود با تغییر این خط عوض کرد.
data-storage-format="BONSAI"

# ---------------------------------------------------------------------------- شبکه
# شناسهٔ شبکهٔ P2P؛ برابر chainId تولیدی (262). VERIFIED که گزینه پذیرفته می‌شود [K].
# توجه: برای آزمون با genesis.TEST-ONLY.json (chain id 262025) فقط همین یک خط در «کپی آزمایشی» این فایل عوض می‌شود (README).
network-id=262

# آدرس عمومی که این نود به همتاها اعلام می‌کند (enode). اینجا فقط «جای‌گیر» است؛ docker-compose.yml با --p2p-host از .env این را
# بازنویسی می‌کند (override با آرگومان خط‌فرمان VERIFIED [K]: enode آدرس جدید را نشان داد). OWNER: آدرس IP ثابت عمومی هر ولیدیتور.
p2p-host="127.0.0.1"

# رابط شنود و پورت P2P (TCP و UDP-discovery هر دو روی همین پورت). [T] VERIFIED
# هشدار فایروال: محدودکردن همتاها با «ufw» روی پورت منتشرشدهٔ Docker اثر ندارد؛ فیلتر باید در DOCKER-USER یا فایروال بیرونی باشد
# (README بخش ۳ مرحلهٔ ۶ و بخش ۸؛ UNVERIFIED روی اوبونتو).
p2p-interface="0.0.0.0"
p2p-port=30303

# NONE = بدون UPnP/NAT خودکار؛ آدرس همان p2p-host صریح است. [K] VERIFIED (فقط راه‌اندازی؛ در شبکهٔ واقعی با NAT/فایروال UNVERIFIED)
nat-method="NONE"

# کشف همتا. تصمیم مالک (۲۰۲۶-۱۱-۲۵): در شبکهٔ تولیدی true (همان مقدار آزموده‌شده [T]). محدودکردن همتاها با فایروال/net-restrict
# جدا تصمیم می‌شود (README، MEDIUM-3). طرح bootnode تولیدی هنوز تعیین نشده است.
discovery-enabled=true

# اتصال مستقیم به ولیدیتورهای دیگر (روش آزموده‌شده، جایگزین --bootnodes در آزمون‌ها [T][D]). فایل باید «وجود داشته باشد»؛
# فرمت: آرایهٔ JSON از enode (نمونه در bootnodes.example.txt). تحویلی کیت `[]` است. VERIFIED با فایل خالی («Connecting to 0 static nodes») [K].
static-nodes-file="/config/static-nodes.json"

# bootnodes: OWNER DECISION — طرح bootnode تولیدی در اسناد نیست. [D] می‌گوید روی Besu 26.9.0 «ویندوزی» --bootnodes خطا داد؛ روی لینوکس/Docker
# سینتکس آرایه پذیرفته شد (VERIFIED [K]: «Resolved 1 bootnodes») ولی اتصال به یک bootnode واقعی آزموده نشد (UNVERIFIED).
# جای‌گیر (تا تعیین enodeهای واقعی فعال نکنید؛ با یک enode ساختگی نود بلند شد ولی به‌جایی وصل نمی‌شود [K]):
# bootnodes=["enode://<128 hex نود>@<IP عمومی>:30303"]
# تصمیم مالک (۲۰۲۶-۱۱-۲۵): bootnode همان نود اول است و در enode به‌جای IP نام DNS می‌آید تا با عوض‌شدن IP شبکه به مشکل نخورد:
# bootnodes=["enode://<128 hex نود اول>@boot-node.surnet.org:30303"]
# نام DNS فقط با --Xdns-enabled=true و --Xdns-update-enabled=true کار می‌کند؛ هر دو در docker-compose.yml هستند (VERIFIED، DNS داخلی docker؛ DNS واقعی UNVERIFIED).
# enode و IP واقعی نود اول هنوز نیست؛ تا آن موقع خط را فعال نکنید.

# حالت همگام‌سازی. برای genesis سفارشی پیش‌فرض Besu همین FULL است [K]. VERIFIED. SNAP/CHECKPOINT با QBFT UNVERIFIED.
# (sync-min-peers عمداً نیست: در حالت FULL «ignored» است؛ در soak-kit بود و هشدار می‌داد [K].)
sync-mode="FULL"

# ---------------------------------------------------------------------------- گاز و بلاک (تصمیم‌های مالک)
# حداقل قیمت گاز = 10^14 wei = 0.0001 سورن (انتقال ساده 21,000 گاز = 2.1 سورن). [D][T] — همهٔ آزمون‌ها و soak همین بود.
# اشتباه نشود: min-gas-price جزو genesis نیست؛ تنظیم محلی هر نود است. پروتکل تراکنش ارزان‌تر را رد نمی‌کند؛ هر ولیدیتور خودش در ساخت بلاک
# اعمال می‌کند. پس همهٔ ولیدیتورها باید این مقدار را داشته باشند. VERIFIED [K]: تراکنش با 1e14 و 1e14/type-2 در بلاک رفت؛
# eth_gasPrice برابر 0x5af3107a4000 (=1e14) برگشت.
min-gas-price=100000000000000

# ===== یافتهٔ مهم [K] (تعارض با انتظار) =====
# با مقدار پیش‌فرض Besu، تراکنشی که «از RPC همین نود» ارسال شود «محلی» است و از min-gas-price معاف است: تراکنش 1e13 (کمتر از حداقل) از RPC
# نود پذیرفته و استخراج شد (آزموده، بلاک 33). دو خط زیر معاف‌سازی را می‌بندند: با هر دو، eth_sendRawTransaction خطای
# -32009 «Gas price below configured minimum gas price» می‌دهد (VERIFIED [K]؛ با یکی از آن‌دو به‌تنهایی کافی نبود: tx-pool-min-gas-price
# بدون no-local-priority تراکنش ارزان را هنوز استخراج کرد). این دو خط در آزمون‌ها و اسناد قبلی نبود: OWNER تأیید کند.
tx-pool-no-local-priority=true
tx-pool-min-gas-price=100000000000000

# ===== یافتهٔ بازبین مستقل (HIGH-3) و محدودیت آن (MEDIUM-A دور ۲) =====
# چون genesis زنجیره zeroBaseFee دارد، baseFee همیشه 0 است و قیمت مؤثر تراکنش «فقط priority fee» است. بدون این گزینه Besu برای eth_maxPriorityFeePerGas
# مقدار 0 برمی‌گرداند (و eth_feeHistory پاداش 0)، در حالی که eth_gasPrice برابر 1e14 است. کتابخانه‌ای که priority را از eth_maxPriorityFeePerGas می‌گیرد
# (viem: estimateFeesPerGas / prepareTransactionRequest) تراکنش type-2 با priority کمتر از حداقل می‌فرستد: یا رد می‌شود یا پذیرفته می‌شود ولی هرگز استخراج
# نمی‌شود و nonceهای بعدی همان حساب را هم می‌بندد.
# min-priority-fee=1e14 (برابر min-gas-price) «eth_maxPriorityFeePerGas» را درست می‌کند: برابر 0x5af3107a4000 می‌شود و تراکنش viem با همین priority استخراج می‌شود
# (VERIFIED [K] با viem + حساب محلی؛ Besu 26.9.0، genesis آزمایشی، یک نود؛ README ۴-۵ و ۷-۷).
# ⚠ این گزینه «eth_feeHistory» را درست نمی‌کند: آزمون بازبین دور ۲ نشان داد پاداش‌های eth_feeHistory برای «بلاک‌های خالی» همچنان 0x0 است
# (پاداش از تراکنش‌های داخل بلاک محاسبه می‌شود؛ در زنجیرهٔ کم‌تراکنش اغلب بلاک خالی است). پس کیف‌پول/dAppی که priority را از fee history
# تخمین می‌زند یا tip ثابت می‌گذارد (مثلاً 1 تا 1.5 gwei، یعنی 1e9 تا 1.5e9 wei، بسیار کمتر از 1e14) می‌تواند تراکنش گیرکرده بسازد.
#   VERIFIED (viem + حساب محلی): مسیر eth_maxPriorityFeePerGas با این گزینه درست است.
#   UNVERIFIED: کیف‌پول‌های injected مثل MetaMask پشت wagmi (روش تخمین‌شان آزموده نشد؛ نباید فرض کرد fee history را نمی‌خوانند).
# پیش از راه‌اندازی «اجباری»: آزمون مسیر واقعی dApp (wagmi + کیف‌پول injected) روی یک زنجیرهٔ دورریختنی با همین config (README بخش ۸).
# گزینه‌های مالک: (الف) dApp priority را صریحاً از eth_maxPriorityFeePerGas بگیرد (نه از کیف‌پول)؛ (ب) در کد dApp یک tip ثابت ≥ 1e14 wei بگذارد
# (maxPriorityFeePerGas ≥ 1e14 و maxFeePerGas ≥ آن)؛ (ج) هر دو.
# باید روی «هر نود» گذاشته شود، از جمله نودهای RPC سرویس‌ها (آن‌ها هستند که به کیف‌پول‌ها قیمت پیشنهادی می‌دهند)، و روی همهٔ ولیدیتورها یکسان باشد
# (مثل min-gas-price تنظیم محلی است، نه پروتکل). محدودیت دوم: این گزینه فقط «قیمت پیشنهادی RPC» را درست می‌کند؛ تراکنشی که priority را صریح 0 بگذارد (maxFee ≥ 1e14) هنوز هش می‌گیرد
# و استخراج نمی‌شود (آزموده [K]؛ روش بازیابی: README ۷-۷).
min-priority-fee=100000000000000
# سایر تنظیمات tx-pool عمداً پیش‌فرض Besu ماندند (LAYERED، 75MB هر لایه، حداکثر 10000 prioritized). تنظیم‌شان بعد از آزمون بار
# با بلاک‌های پر انجام شود (OWNER/UNVERIFIED).
# هشدار: گزینهٔ tx-pool-retention-hours مخصوص pool sequenced است؛ با pool لایه‌ای (این کیت) Besu 26.9.0 بالا نمی‌آید (VERIFIED)؛ انقضای زمانی وجود ندارد (README ۷-۸).

# سقف گاز بلاک. genesis تولیدی 45,000,000 دارد؛ این خط همان مقدار را برای «پایداری» می‌گذارد. VERIFIED [K] روی QBFT:
#  - با 40M در genesis و target 45M، سقف هر بلاک ≈ +parent/1024 رفت بالا (بلاک 1: 40,039,061؛ بلاک 12: 40,471,258)؛
#  - با target 35M پایین آمد (39,960,939 در بلاک 1)؛ بدون این گزینه همان سقف genesis ماند.
# یعنی این گزینه در QBFT واقعاً کار می‌کند: با genesis = 45M بی‌اثر و تغییر بعدی سقف گاز بدون genesis جدید ممکن است (ولیدیتورها یکی‌یکی).
# هشدار: همهٔ ولیدیتورها باید مقدار «یکسان» داشته باشند؛ هر ولیدیتور بلاک‌هایش را به‌سمت target خودش می‌برد. رفتار با چند ولیدیتور با target
# متفاوت UNVERIFIED. شرط مالک: آزمون بلندمدت با بلاک‌های واقعاً پر روی 45M هنوز انجام نشده (باز).
target-gas-limit=45000000

# ---------------------------------------------------------------------------- RPC (فقط محلی؛ compose روی 127.0.0.1 میزبان publish می‌کند)
# داخل کانتینر باید روی 0.0.0.0 گوش دهد تا port-mapping کار کند؛ مرز امنیتی «publish فقط روی 127.0.0.1» در compose است. [K] VERIFIED
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545

# فقط API لازم برای اپراتور: ADMIN برای admin_nodeInfo (enode) و admin_peers (پایش Verifier)، QBFT برای qbft_getValidatorsByBlockNumber،
# TXPOOL برای txpool_besuTransactions. فهرست آزموده‌شدهٔ soak [T] بدون DEBUG/TRACE. VERIFIED.
# TRACE (trace_block برای RewardRouter) فقط روی نود RPC سرویس‌ها [D]، نه روی ولیدیتور؛ هرگز ADMIN را عمومی نکنید.
rpc-http-api=["ETH","NET","WEB3","QBFT","ADMIN","TXPOOL"]

# نام میزبانِ مجاز در هدر Host (روی RPC و متریک هر دو اعمال می‌شود). با Host دیگر پاسخ 403 می‌دهد (VERIFIED [K]). مقدار "*" در آزمون‌ها بود [T] ولی برای تولید لازم نیست.
# "validator" = نام سرویس در docker-compose.yml فقط برای Prometheus اختیاری (Host=validator:9545؛ بدون آن 403 می‌گیرد، VERIFIED [K]).
# در شبکهٔ compose فقط همان کانتینر Prometheus به آن می‌رسد؛ RPC بیرون از 127.0.0.1 میزبان publish نمی‌شود. healthcheck داخل کانتینر با Host: localhost می‌زند. CORS عمداً تنظیم نشده (پیش‌فرض: هیچ origin؛ در لاگ corsAllowedDomains=[]).
host-allowlist=["localhost","127.0.0.1","validator"]

# ---------------------------------------------------------------------------- پایش
# متریک Prometheus (/metrics). داخل کانتینر روی 0.0.0.0؛ روی میزبان فقط 127.0.0.1:9545 (compose). VERIFIED [K] (متریک‌های besu_* برگشت).
metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9545

# سطح لاگ. لاگ به stdout می‌رود و Docker آن را با سقف اندازه می‌چرخاند (compose). VERIFIED.
# F-1 (بررسی‌نشده): پایش خط «IllegalStateException: Failed validator smart contract call» در لاگ [D].
logging="INFO"

# ---------------------------------------------------------------------------- عمداً تنظیم نشده (پیش‌فرض Besu)
# max-peers (25)، rpc-gas-cap (100,000,000 > سقف بلاک)، poa-block-txs-selection-max-time (+75٪ زمان بلاک = حدود 2.25 ثانیه از 3)،
# transitions.qbft (در genesis است نه اینجا). هیچ‌کدام در آزمون‌ها/اسناد تغییر نکرده؛ نتیجهٔ پیش‌فرض‌ها زیر بار پر UNVERIFIED.
