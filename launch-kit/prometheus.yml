# prometheus.yml — فقط برای profile اختیاری «monitoring» در docker-compose.yml
# نود Besu متریک را روی validator:9545 (داخل شبکهٔ compose) می‌دهد؛ روی میزبان فقط 127.0.0.1.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sur-besu-validator
    metrics_path: /metrics
    # Besu هدر Host را با host-allowlist می‌سنجد (روی متریک هم): Prometheus نمی‌گذارد Host را عوض کنیم ("setting header Host is not allowed")،
    # پس نام سرویس «validator» در host-allowlist فایل config.toml آمده است (VERIFIED؛ بدون آن: 403).
    static_configs:
      - targets: ["validator:9545"]
        labels:
          chain_id: "262"     # برای آزمون با genesis.TEST-ONLY.json بی‌اهمیت است
