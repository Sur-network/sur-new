# =====================================================================================================
# SUR — یک نود ولیدیتور Besu 26.9.0 (QBFT)         پیشنهاد کیت راه‌اندازی v2.5
# اجرا:   cp .env.example .env   ← مقدارها را پر کنید (فقط مسیر و پورت؛ هیچ کلیدی داخل مخزن/فایل env نیست)
#         docker compose config            ← بررسی
#         docker compose up --no-start validator  ← ساخت حجم؛ سپس chown یک‌باره (README بخش ۳ مرحلهٔ ۵)
#         docker compose up -d             ← نود (Prometheus فقط با:  docker compose --profile monitoring up -d )
# پیش از اولین up: حجم داده باید یک‌بار برای uid 1000 chown شود (README بخش ۳، مرحلهٔ ۵)؛ کانتینر با user 1000:1000 اجرا می‌شود.
# هر سطر با برچسب VERIFIED/UNVERIFIED/OWNER: توضیح در README.md. «VERIFIED» = روی Docker Desktop (لینوکس VM) با همین فایل اجرا شد؛
# رفتار دسترسی‌های فایل روی یک سرور اوبونتو UNVERIFIED است (آزمون Docker Desktop مجوزهای فایل را مثل لینوکس اعمال نمی‌کند).
# =====================================================================================================

services:
  validator:
    # نسخهٔ سنجاق‌شده، بدون latest. نسخهٔ آزموده: 26.9.0. تغییر نسخه = تصمیم هماهنگ همهٔ ولیدیتورها (سند معماری بخش 8). VERIFIED
    image: hyperledger/besu:${SUR_BESU_TAG:-26.9.0}
    container_name: ${SUR_CONTAINER_NAME:-sur-validator}
    restart: unless-stopped
    # اجرا با uid/gid 1000 (کاربر besu تصویر). علت [بازبینی مستقل + آزمون زنده]: اگر کانتینر با root شروع شود، entrypoint تصویر با «su» به کاربر besu می‌رود و
    # «su» با SIGTERM پروسهٔ Besu را SIGKILL می‌کند؛ هر توقف (stop، ری‌استارت، ارتقا) JVM را حدود 2 ثانیه بعد با کد 143 و لاگ نیمه‌کاره می‌کُشت و
    # stop_grace_period بی‌اثر بود. با user: 1000:1000 entrypoint «su» را رد می‌کند و Besu خودش پروسهٔ اول است (shutdown hook کامل می‌شود). VERIFIED (README ۴-۴).
    # شرط: حجم داده «پیش از» اولین اجرا برای uid 1000 chown شده باشد (README بخش ۳)؛ کانتینر دیگر ریشه نیست و خودش chown نمی‌کند.
    # توصیه (LOW-2/LOW-3 دور ۲): uid 1000 روی Ubuntu cloud معمولاً همان کاربر ورود (ubuntu) است و کلید 0400 برای آن حساب SSH خواناست؛ uid اختصاصی (مثلاً 10001) بهتر است.
    # برای تغییر: user: "10001:10001" + chown -R 10001:10001 روی حجم داده + chown 10001:10001 روی فایل کلید (0400) (README بخش ۵). «1000:1000» پیش‌فرض آزموده‌شده است؛
    # با uid 10001 راه‌اندازی آزموده شد و بازبین دور ۳ تولید بلاک را هم دید؛ shutdown تمیز با 10001 آزموده نشد. config.toml / genesis.json / static-nodes.json هم باید برای همین uid خوانا باشند (0644 یا مالک همان uid)؛ وگرنه Besu با کد 2 می‌افتد.
    user: "1000:1000"
    # مهلت خاموش‌شدن تمیز (RocksDB)؛ با user بالا مؤثر است (توقف در آزمون چند ثانیه طول کشید، README ۴-۴). فقط سقف است، نه زمان لازم.
    stop_grace_period: 60s

    # --p2p-host از .env: آدرس عمومی هر ولیدیتور (در config.toml فقط جای‌گیر است؛ override با خط‌فرمان VERIFIED).
    # OWNER: آدرس IP عمومی ثابت هر ولیدیتور. بدون آن compose شروع نمی‌شود.
    command:
      - --config-file=/config/config.toml
      - --p2p-host=${SUR_P2P_HOST:?SUR_P2P_HOST را در .env بگذارید (IP عمومی همین نود)}

    ports:
      # P2P: عمومی (TCP + UDP-discovery). فایروال: فقط IPهای ولیدیتورهای دیگر (bootnodes.example.txt)
      # هشدار: پورت منتشرشدهٔ Docker از قواعد «ufw» رد می‌شود (ufw روی INPUT است، Docker از FORWARD/DNAT می‌گذرد). فیلتر را در زنجیرهٔ DOCKER-USER
      # (با -m conntrack --ctorigdstport ... --ctdir ORIGINAL) یا فایروال بیرونی/ابری بگذارید؛ README بخش ۳ مرحلهٔ ۶. UNVERIFIED روی اوبونتو (الگوی DOCKER-USER روی موتور لینوکس آزموده شد).
      # فقط IPv4 (MEDIUM-1 دور ۳): نحو کوتاه بدون آدرس ("30303:30303") روی 0.0.0.0 «و» [::] هر دو منتشر می‌شود و ترافیک [::] را docker-proxy می‌گیرد؛ آن مسیر از
      # FORWARD/DOCKER-USER رد نمی‌شود، پس قاعدهٔ DOCKER-USER فقط IPv4 را می‌بندد. آدرس صریح IPv4 (پیش‌فرض 0.0.0.0، متغیر SUR_P2P_BIND) فقط روی IPv4 گوش می‌دهد. VERIFIED (dind، README بخش ۴-۶).
      # اگر IPv6 عمومی لازم دارید، آدرس IPv6 را جدا و آگاهانه منتشر کنید و ip6tables/فایروال بیرونی بگذارید (README بخش ۳ مرحلهٔ ۶).
      - "${SUR_P2P_BIND:-0.0.0.0}:${SUR_P2P_PORT:-30303}:30303/tcp"
      - "${SUR_P2P_BIND:-0.0.0.0}:${SUR_P2P_PORT:-30303}:30303/udp"
      # هشدار: API «ADMIN» در RPC فعال است و Host: validator در host-allowlist هست؛ هر کانتینر دیگری روی همین شبکهٔ compose (sur) به آن می‌رسد. هیچ سرویس دیگری را روی این شبکه نگذارید.
      # RPC و متریک: فقط روی 127.0.0.1 میزبان. هرگز 0.0.0.0 نکنید (ADMIN در RPC فعال است). VERIFIED [Docker Desktop]: curl از IP شبکهٔ خود میزبان به RPC و متریک وصل نشد، از 127.0.0.1 وصل شد
      - "127.0.0.1:${SUR_RPC_PORT:-8545}:8545"
      - "127.0.0.1:${SUR_METRICS_PORT:-9545}:9545"

    volumes:
      # داده: volume نام‌دار (همان روش ابزار verify). OWNER: برای دیسک اختصاصی می‌توانید bind mount بگذارید (مالک باید uid 1000 باشد: chown -R 1000:1000؛ UNVERIFIED روی لینوکس)
      - data:/data
      # پیکربندی‌ها، فقط‌خواندنی. مسیر میزبان از .env؛ فایل باید «وجود داشته باشد» (روی Docker Desktop مسیر ناموجود به‌صورت «پوشه» ساخته می‌شود؛ روی موتور لینوکس با create_host_path: false خطا می‌دهد، ذیل)
      # نحو بلند با create_host_path: false: روی موتور لینوکس اگر مسیر میزبان وجود نداشته باشد Docker خطا می‌دهد و پوشه نمی‌سازد (VERIFIED روی docker:dind: «bind source path does not exist»).
      # ساخته‌شدن «پوشه» به‌جای فایل (نحو کوتاه) فقط روی Docker Desktop دیده شد و آنجا این گزینه هم اثر نداشت و پوشه ساخته شد (فقط محیط آزمون، نه سرور لینوکس).
      - type: bind
        source: ${SUR_CONFIG_FILE:-./config.toml}
        target: /config/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SUR_GENESIS_FILE:?SUR_GENESIS_FILE را در .env بگذارید (genesis.json تولیدی؛ نه genesis.TEST-ONLY.json)}
        target: /config/genesis.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SUR_STATIC_NODES_FILE:-./static-nodes.json}
        target: /config/static-nodes.json
        read_only: true
        bind:
          create_host_path: false
      # کلید نود (= کلید اپراتور) فقط‌خواندنی از مسیر خارج از مخزن. هرگز در مخزن/تصویر/لاگ نیاید. کلید از Vault تحویل داده می‌شود (README).
      # فایل کلید باید مالک uid 1000 باشد (0400)؛ با مالک دیگر Besu خطای گمراه‌کنندهٔ «does not contain valid keyPair» می‌دهد (.env.example).
      - type: bind
        source: ${SUR_NODE_KEY_FILE:?SUR_NODE_KEY_FILE را در .env بگذارید (مسیر فایل کلید اپراتور؛ خارج از مخزن)}
        target: /secrets/node.key
        read_only: true
        bind:
          create_host_path: false

    # healthcheck: تصویر curl/nc/wget ندارد (بررسی شد) ولی bash دارد؛ با /dev/tcp یک eth_chainId می‌فرستد و chainId را با مقدار
    # مورد انتظار می‌سنجد (SUR_CHAIN_ID_HEX، پیش‌فرض 0x106 = 262). جایگزین healthcheck خود تصویر («[ -f /tmp/pid ]») است. VERIFIED
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          body='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          exec 3<>/dev/tcp/127.0.0.1/8545 || exit 1
          printf 'POST / HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' "$${#body}" "$$body" >&3
          resp=$$(timeout 4 cat <&3)
          case "$$resp" in *'"result":"${SUR_CHAIN_ID_HEX:-0x106}"'*) exit 0;; esac
          exit 1
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s

    # لاگ Docker با سقف اندازه (لاگ Besu روی stdout است). VERIFIED (docker inspect LogConfig)
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

    # سخت‌سازی. privileged نیست، غیرریشه (user بالا) و cap_drop ALL «بدون» هیچ cap_add (پنج قابلیت قبلی فقط برای entrypoint ریشه لازم بود). VERIFIED [نود بلند شد و بلاک ساخت]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # پروسهٔ Java حافظه را خودش از محدودیت کانتینر می‌گیرد؛ تنظیم دستی: OWNER/UNVERIFIED (soak-kit با JAVA_OPTS="-Xmx768m" و mem_limit 1.5g روی شبکهٔ آزمایشی بود، نه تولید)
    # environment:
    #   JAVA_OPTS: "-Xms512m -Xmx2g"
    # mem_limit: 4g
    # cpus: 2

    networks:
      - sur

  # ----------------------------------------------------------------------------------------------
  # اختیاری: Prometheus فقط با  docker compose --profile monitoring up -d  (پیش‌فرض بالا نمی‌آید).
  # تصویر سنجاق‌شده؛ در این کیت هرگز pull نشد (تصویر محلی استفاده شد)؛ prometheus.yml همین پوشه. فقط روی 127.0.0.1:9090.
  # ----------------------------------------------------------------------------------------------
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:${SUR_PROMETHEUS_TAG:-v3.13.4}
    container_name: ${SUR_CONTAINER_NAME:-sur-validator}-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${SUR_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - type: bind
        source: ./prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - sur
    depends_on:
      - validator

volumes:
  data:
    name: ${SUR_VOLUME_NAME:-sur-validator-data}
  prometheus-data:
    name: ${SUR_VOLUME_NAME:-sur-validator-data}-prometheus

networks:
  sur:
    name: ${SUR_NETWORK_NAME:-sur-validator-net}
