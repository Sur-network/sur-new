# دو در برای رجیستری. نکته: کلاینت داکر اگر /v2/ بدون ورود ۲۰۰ بدهد، هنگام push رمز نمی‌فرستد؛
# برای همین «خواندن عمومی + نوشتن با ورود» روی یک در ممکن نیست و دو در جدا داریم.

# ── در خواندن (عمومی): فقط GET و HEAD؛ هر نوشتن رد می‌شود
server {
    listen 5000;
    server_name _;
    client_max_body_size 1m;

    location /v2/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://registry:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}

# ── در نوشتن (فقط CI و مدیر): ورود برای همهٔ درخواست‌ها
server {
    listen 5001;
    server_name _;
    client_max_body_size 0;
    chunked_transfer_encoding on;

    auth_basic "Sur registry (push)";
    auth_basic_user_file /etc/nginx/htpasswd;

    location /v2/ {
        proxy_pass http://registry:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
